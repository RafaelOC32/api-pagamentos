name: verify

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag da imagem para verificar, exemplo v1.1.0"
        required: true

permissions:
  contents: read
  id-token: write
  packages: read

jobs:
  verify:
    name: Verify signature and attestations
    runs-on: ubuntu-latest

    steps:
      - name: Define lowercase image name
        id: image
        shell: bash
        run: |
          IMAGE_REPOSITORY="ghcr.io/${GITHUB_REPOSITORY,,}"
          IMAGE_NAME="$IMAGE_REPOSITORY:${{ inputs.tag }}"

          echo "IMAGE_REPOSITORY=$IMAGE_REPOSITORY" >> "$GITHUB_ENV"
          echo "IMAGE_NAME=$IMAGE_NAME" >> "$GITHUB_ENV"

          echo "Imagem repository: $IMAGE_REPOSITORY"
          echo "Imagem tag: $IMAGE_NAME"

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Verify image signature
        shell: bash
        run: |
          echo "Verificando assinatura da imagem: $IMAGE_NAME"

          cosign verify \
            "$IMAGE_NAME" \
            --certificate-identity-regexp "^https://github.com/${{ github.repository }}/.*" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com"

      - name: Verify CycloneDX SBOM attestation
        shell: bash
        run: |
          echo "Verificando attestation CycloneDX da imagem: $IMAGE_NAME"

          cosign verify-attestation \
            "$IMAGE_NAME" \
            --type cyclonedx \
            --certificate-identity-regexp "^https://github.com/${{ github.repository }}/.*" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com"