name: verify

on:
  pull_request:

permissions:
  contents: read
  id-token: write

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: sigstore/cosign-installer@v3

      - name: Verify Signature
        run: |
          cosign verify \
          ghcr.io/${{ github.repository }}:latest \
          --certificate-oidc-issuer=https://token.actions.githubusercontent.com